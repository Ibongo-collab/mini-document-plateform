name: CI

# Déclenche le pipeline sur chaque push et chaque pull request vers main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Permet aussi de lancer le workflow manuellement depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation du JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest fournit nativement un daemon Docker fonctionnel :
      - name: Build complet + tests (unitaires et integration Testcontainers)
        run: mvn -B clean verify

      - name: Publication des rapports de tests (si echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

      - name: Publication des artefacts .jar (si succes)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-jars
          path: |
            api-gateway/target/*.jar
            document-service/target/*.jar
            config-server/target/*.jar
          retention-days: 7
