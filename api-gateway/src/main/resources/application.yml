spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: document-service
          # URL configurable via la variable d'environnement DOCUMENT_SERVICE_URL.
          # En local, pointe par defaut sur l'instance document-service par defaut.
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/documents/**
          filters:
            - StripPrefix=1

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
