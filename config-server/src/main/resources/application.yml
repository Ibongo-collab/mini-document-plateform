spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # TODO — business implementation : remplacer par l'URL reelle du
          # repository config-repository (local ou distant) une fois pousse sur GitHub.
          uri: ${CONFIG_REPO_URI:file://${user.dir}/../config-repository}
          default-label: ${CONFIG_REPO_BRANCH:main}
          clone-on-start: true

server:
  port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info
